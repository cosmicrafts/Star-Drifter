[package]
name = "star-drifter"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.17.3"
bevy_pancam = "0.19.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

[profile.dev.package."*"]
opt-level = 3
