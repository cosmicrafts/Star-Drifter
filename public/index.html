<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Star Drifter — Cosmicrafts</title>
  <meta name="description" content="A space node-map roguelike: pick a faction, jump between sectors, resolve events, manage fuel, scrap and hull." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚀</text></svg>" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="hud" class="hidden"></div>

    <!-- finger tutorial (points where to tap; steps complete on action) -->
    <div id="finger" class="hidden"><div class="f-hand">👇</div><div id="finger-label"></div><div class="f-ring"></div></div>
    <button id="tutskip" class="hidden">SKIP ✕</button>

    <!-- Faction select -->
    <div id="menu" class="overlay">
      <p class="kicker">[ CHOOSE YOUR FACTION ]</p>
      <h1>STAR DRIFTER</h1>
      <p class="sub">Jump the node map. Resolve events. Mind the fuel.</p>
      <div id="factions"></div>
      <p class="hint">Click a connected node to jump (1 fuel) · pan by dragging · wheel to zoom · keys 1-4 pick event choices</p>
    </div>

    <!-- Codec dialogue (MGS-style) -->
    <div id="codec" class="hidden">
      <div id="codec-portrait"></div>
      <div id="codec-body">
        <div id="codec-name">???</div>
        <div id="codec-text"></div>
        <div id="codec-choices"></div>
      </div>
    </div>

    <!-- Game over -->
    <div id="over" class="overlay hidden">
      <p class="kicker">[ SIGNAL LOST ]</p>
      <h1 id="over-title">DRIFT ENDED</h1>
      <p class="sub" id="over-stats"></p>
      <button id="again" class="btn btn-primary">DRIFT AGAIN</button>
    </div>

    <div id="banner" class="hidden"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
