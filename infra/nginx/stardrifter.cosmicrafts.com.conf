server {
    listen 80;
    server_name stardrifter.cosmicrafts.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name stardrifter.cosmicrafts.com;

    include snippets/cloudflare-origin.conf;

    ssl_certificate     /usr/local/etc/nginx/self-signed.crt;
    ssl_certificate_key /usr/local/etc/nginx/self-signed.key;
    include snippets/ssl-params.conf;

    root /var/www/stardrifter.cosmicrafts.com/current;
    index index.html;

    # Static JS game, no SPA fallback needed (single index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Game files use stable names edited by hand: 1h + revalidate,
    # never immutable (immutable once froze browsers for a year).
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2|woff)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }
}
